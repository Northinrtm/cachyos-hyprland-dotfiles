# hyprpaper 0.8.x config format: wallpapers are declared as `wallpaper { }`
# blocks keyed by `monitor`. Note that `source =` is hyprlang's include
# directive, not the image path — the image key is `path`.

# Hides the Hyprland splash quote that hyprpaper draws over the wallpaper.
# misc:disable_splash_rendering in hyprland.lua does not affect this: it only
# covers Hyprland's own background, which sits underneath hyprpaper's layer.
splash_opacity = 0

wallpaper {
    monitor = DP-2
    path = $HOME/Pictures/wallpapers/wallpaper1.png
    fit_mode = cover
}

wallpaper {
    monitor = DVI-D-1
    path = $HOME/Pictures/wallpapers/wallpaper2.png
    fit_mode = cover
}
